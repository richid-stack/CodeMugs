# Local development dependencies only. The credentials below are for local use and must never
# be reused anywhere else. Ports bind to loopback so nothing is exposed to the network.
#
#   pnpm infra:up      start and wait until healthy
#   pnpm infra:down    stop (add -v to also delete data)
name: codemugs-dev

services:
  postgres:
    # Postgres with the pgvector extension (semantic retrieval).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: codemugs
      POSTGRES_PASSWORD: codemugs_dev_only
      POSTGRES_DB: codemugs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemugs -d codemugs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
