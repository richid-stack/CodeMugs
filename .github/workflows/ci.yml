name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two PostgreSQL majors, because both are supported (ADR 0009). Disposable, CI-only
    # credentials: the same throwaway value as the dev compose file.
    services:
      postgres18:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: codemugs_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres17:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: codemugs_dev_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # A missing database must fail the run, never skip the isolation tests silently.
      REQUIRE_DATABASE_TESTS: "true"
      CODEMUGS_TEST_DATABASE_URL: postgres://postgres:codemugs_dev_only@localhost:5432/postgres
      # The same for the sandbox driver: no docker daemon, or no image, must fail the run. The
      # image is alpine 3.22 as the registry returned it on 2026-11-11, pinned by digest; docker
      # checks the digest when it pulls (ADR 0017).
      REQUIRE_DOCKER_TESTS: "true"
      # And for gVisor: the runsc runtime must be registered with the daemon (ADR 0018).
      REQUIRE_GVISOR_TESTS: "true"
      CODEMUGS_TEST_SANDBOX_IMAGE: docker.io/library/alpine@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull the sandbox test image
        run: docker pull "$CODEMUGS_TEST_SANDBOX_IMAGE"
      - name: Install gVisor
        # gVisor release 20261109.0 for x86_64, pinned by the checksum of its archive. Both were
        # read from Google's release bucket on 2026-11-11 and are trusted on first use. To update:
        # read the new release's gvisor.tar.zstd.sha512, run the sandbox tests, and change both
        # values in one reviewed commit (ADR 0018).
        env:
          GVISOR_RELEASE: "20261109.0"
          GVISOR_SHA512: "0a0041fd862f4ea3042a9db8d41c742f48a01f909699adc2a0256e46d85e53f97b82b9fd154b3dce636f62b8d557677639f91c77d13f3f875ff9fa535275393c"
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          wget -q "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.zstd"
          echo "${GVISOR_SHA512}  gvisor.tar.zstd" | sha512sum -c -
          sudo tar --zstd -xf gvisor.tar.zstd -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl reload docker
          /usr/local/bin/runsc --version
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Test (PostgreSQL 18)
        run: pnpm test
      - name: Database tests (PostgreSQL 17)
        run: pnpm --filter @codemugs/storage --filter @codemugs/auth --filter @codemugs/ingestion --filter @codemugs/jobs --filter @codemugs/worker --filter @codemugs/migrate --filter @codemugs/api test
        env:
          CODEMUGS_TEST_DATABASE_URL: postgres://postgres:codemugs_dev_only@localhost:5433/postgres
      - run: pnpm smoke

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/Dockerfile.api -t codemugs-api:ci .
