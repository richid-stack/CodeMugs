# TEMPORARY. Reads what escape attempts and resource abuse do under the hardened container and under
# gVisor on a hosted runner, with the options the driver uses, so that the tests are written from
# what was observed. Removed before the pull request is merged.
name: Probe escape and abuse

on:
  push:
    branches: [test/sandbox-escape-and-abuse]
    paths: [".github/workflows/probe-escape.yml"]

permissions:
  contents: read

jobs:
  probe:
    name: Probe escape and abuse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install gVisor (pinned release and checksum, as in ci.yml) and run the scenarios
        run: |
          cat > probe.sh <<'EOF'
          set -u
          IMG=docker.io/library/alpine@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
          docker pull -q "$IMG" >/dev/null
          cd "$(mktemp -d)"
          wget -q https://storage.googleapis.com/gvisor/releases/release/20261109.0/x86_64/gvisor.tar.zstd
          echo '0a0041fd862f4ea3042a9db8d41c742f48a01f909699adc2a0256e46d85e53f97b82b9fd154b3dce636f62b8d557677639f91c77d13f3f875ff9fa535275393c  gvisor.tar.zstd' | sha512sum -c -
          sudo tar --zstd -xf gvisor.tar.zstd -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl reload docker
          sleep 3
          echo "### host"
          uname -r; docker version --format 'docker {{.Server.Version}}'
          echo "host core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          for n in cgroup ipc mnt net pid user uts time; do echo "host ns $n=$(readlink /proc/self/ns/$n)"; done
          HOSTIP=$(hostname -I | awk '{print $1}'); echo "host ip: $HOSTIP"
          # something on the host's loopback and on all of its addresses, to be reached from inside
          python3 -m http.server 18080 --bind 0.0.0.0 >http.log 2>&1 &
          sleep 1; curl -s -o /dev/null -w "host listener answers locally: %{http_code}\n" http://127.0.0.1:18080/
          sleep 1234 & HOSTPID=$!
          mkdir -p src && echo "hello from the source" > src/hello.txt
          echo HOST-SECRET > "$PWD/outside-marker"
          ln -s "$PWD/outside-marker" src/abs; ln -s ../outside-marker src/rel; ln -s .. src/up
          ln -s / src/root; ln -s /proc/1/root src/procroot; ln -s /etc/hostname src/hostname
          base=(--network=none --ipc=private --read-only --cap-drop=ALL --security-opt=no-new-privileges --user=65534:65534 --ulimit=nofile=1024:1024 --ulimit=core=0:0 --log-driver=none)
          r() {
            local rt=$1; local rtflag=()
            [ "$rt" = runsc ] && rtflag=(--runtime=runsc)
            timeout 150 docker run --rm "${rtflag[@]}" "${base[@]}" --pids-limit="${PIDS:-64}" --memory="${MEM:-256m}" --memory-swap="${MEM:-256m}" --cpus="${CPUS:-1}" \
              --tmpfs=/scratch:rw,noexec,nosuid,nodev,mode=0700,uid=65534,gid=65534,size="${SCR:-16}"m --workdir=/scratch \
              --mount type=bind,src="$PWD/src",dst=/workspace,readonly --entrypoint=sh "$IMG" -c "$2"
            echo "[exit=$?]"
          }
          S() { for rt in runc runsc; do echo "=== $1 [$rt]"; r $rt "$2" 2>&1 | head -c "${LIMIT:-4500}"; done; }

          S applets 'busybox --list | tr "\n" " "; echo; which python3 perl nc curl wget strace 2>&1 | head'
          S mountinfo 'cat /proc/self/mountinfo'
          S writable-places 'for d in /dev/shm /dev/mqueue /dev/pts /dev /tmp /run /var/tmp /etc /root /home /proc /sys /sys/fs/cgroup /workspace /scratch /; do if touch $d/.probe 2>/dev/null; then echo "writable $d"; rm -f $d/.probe; else echo "not-writable $d"; fi; done; for f in /etc/hosts /etc/hostname /etc/resolv.conf; do if { echo x >> $f; } 2>/dev/null; then echo "writable $f"; else echo "not-writable $f"; fi; done'
          S shm-fill 'df -k /dev/shm | tail -1; dd if=/dev/zero of=/dev/shm/big bs=1M count=100 2>&1 | tail -3; ls -la /dev/shm; df -k /dev/shm | tail -1'
          S shm-write 'echo A > /dev/shm/marker; ls -la /dev/shm'
          S shm-read 'ls -la /dev/shm'
          S dev 'ls -la /dev; echo x > /dev/null; echo null=$?; ls /dev/pts 2>&1 | head -3'
          S mount 'mount -t tmpfs none /mnt 2>&1; echo tmpfs=$?; mount --bind /scratch /mnt 2>&1; echo bind=$?; mount -o remount,rw / 2>&1; echo remount-root=$?; mount -o remount,rw /workspace 2>&1; echo remount-src=$?; umount /proc 2>&1; echo umount-proc=$?'
          S unshare 'unshare -U true 2>&1; echo user=$?; unshare -m true 2>&1; echo mnt=$?; unshare -p -f true 2>&1; echo pid=$?; unshare -n true 2>&1; echo net=$?; unshare -i true 2>&1; echo ipc=$?; unshare -u true 2>&1; echo uts=$?; unshare -C true 2>&1; echo cgroup=$?'
          S chroot-mknod-chown 'chroot / true 2>&1; echo chroot=$?; mknod /scratch/n c 1 3 2>&1; echo mknod=$?; echo a > /scratch/f; chown 0:0 /scratch/f 2>&1; echo chown=$?; chmod u+s /scratch/f; ls -l /scratch/f; id'
          S kernel-knobs 'p=$(cat /proc/sys/kernel/core_pattern 2>&1); echo core_pattern=$p; { echo "$p" > /proc/sys/kernel/core_pattern; } 2>&1; echo write-core=$?; { echo h > /proc/sysrq-trigger; } 2>&1; echo sysrq=$?; { echo 0 > /proc/sys/kernel/dmesg_restrict; } 2>&1; echo dmesg_restrict=$?; ls -ld /proc/sys /proc/sysrq-trigger /proc/kcore /proc/keys /proc/sched_debug /proc/timer_list 2>&1; head -c 16 /proc/kcore 2>&1 | wc -c; head -3 /proc/keys 2>&1; head -2 /proc/kmsg 2>&1; dmesg 2>&1 | head -2'
          S modules-swap-time 'insmod /dev/null 2>&1; echo insmod=$?; swapon /dev/null 2>&1; echo swapon=$?; d=$(date +%s); date -s @$d 2>&1; echo date=$?; hostname probe 2>&1; echo hostname=$?; nice -n -5 true 2>&1; echo nice=$?; sysctl -w kernel.hostname=x 2>&1; echo sysctl=$?'
          S cgroups 'cat /proc/self/cgroup; ls /sys/fs/cgroup 2>&1 | head -20; mkdir /sys/fs/cgroup/probe 2>&1; echo mkdir=$?; { echo 1 > /sys/fs/cgroup/cgroup.procs; } 2>&1; echo write=$?; cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/pids.max 2>&1; ls /sys/fs/cgroup/*/release_agent 2>&1 | head -2'
          S namespaces 'for n in cgroup ipc mnt net pid user uts time; do echo $n=$(readlink /proc/self/ns/$n 2>&1); done'
          S open-files 'ls -l /proc/self/fd; echo ---; ls -l /proc/1/fd; echo ---; ls -l /proc/self/cwd /proc/self/root'
          S overwrite-binaries '{ echo x > /proc/self/exe; } 2>&1; echo exe=$?; { echo x > /bin/busybox; } 2>&1; echo bin=$?; sha256sum /bin/busybox'
          S binaries-after 'sha256sum /bin/busybox'
          S source-symlinks 'for l in abs rel up root procroot hostname; do echo "== $l"; ls -ld /workspace/$l; cat /workspace/$l 2>&1 | head -2; done; ls /workspace/up | head -5; head -2 /workspace/root/etc/os-release; cat /workspace/../outside-marker 2>&1; ls /outside-marker 2>&1'
          S information 'env; echo ---; hostname; cat /etc/hostname; cat /etc/resolv.conf; cat /etc/hosts; echo ---; tr "\0" "\n" < /proc/self/environ; echo ---; tr "\0" " " < /proc/1/cmdline; echo; head -3 /proc/cpuinfo; head -2 /proc/meminfo; cat /proc/version'
          S network "cat /proc/net/unix; head -3 /proc/net/tcp; cat /proc/net/route; wget -q -T 2 -O- http://127.0.0.1:18080/ 2>&1; echo lo=\$?; wget -q -T 2 -O- http://$HOSTIP:18080/ 2>&1; echo hostip=\$?; wget -q -T 2 -O- http://172.17.0.1:18080/ 2>&1; echo gateway=\$?; wget -q -T 2 -O- http://1.1.1.1/ 2>&1; echo internet=\$?; nslookup example.com 2>&1 | head -3"
          echo "host listener log (only the host's own request may be there):"; cat http.log
          S host-processes "ls /proc | grep -c '^[0-9]'; kill -0 $HOSTPID 2>&1; echo kill-host-pid=\$?; kill -9 -1 2>&1; echo kill-all=\$?"
          echo "host sleep 1234 still there: $(kill -0 $HOSTPID && echo yes)"
          S rlimits 'ulimit -n; ulimit -Hn; ulimit -n 4096 2>&1; echo raise-nofile=$?; ulimit -c; ulimit -c unlimited 2>&1; echo raise-core=$?'
          S segv 'ulimit -c; sh -c "kill -SEGV \$\$"; echo status=$?; ls -la /scratch | head -5'
          echo "after segv on the host: core_pattern=$(cat /proc/sys/kernel/core_pattern)"; ls -la /var/crash 2>&1 | head -3; ls /var/lib/systemd/coredump 2>&1 | head -3
          PIDS=64 S fork-bomb 'b() { b | b & }; b; sleep 3; echo parent-survived'
          echo "host sleeps and shells left: $(pgrep -c -x sleep || true)"; docker ps -aq | wc -l
          CPUS=1 S cpu-1 's=$(date +%s); i=0; while [ $i -lt 1500000 ]; do i=$((i+1)); done; e=$(date +%s); echo elapsed=$((e-s))'
          CPUS=0.2 S cpu-0.2 's=$(date +%s); i=0; while [ $i -lt 1500000 ]; do i=$((i+1)); done; e=$(date +%s); echo elapsed=$((e-s))'
          start=$(date +%s); MEM=128m S inode-flood 'timeout 100 sh -c "seq 1 1000000 | xargs -n 2000 touch"; echo status=$?; ls /scratch | wc -l'; echo "inode flood took $(( $(date +%s) - start )) s on the host side"
          MEM=64m S shm-and-scratch-vs-memory 'dd if=/dev/zero of=/dev/shm/a bs=1M count=60 2>&1 | tail -1; dd if=/dev/zero of=/scratch/b bs=1M count=15 2>&1 | tail -1; echo done'
          S file-handles 'i=0; while [ $i -lt 5000 ]; do : > /scratch/f$i || break; i=$((i+1)); done; echo made=$i'
          echo "### end"
          EOF
          bash probe.sh 2>&1
