# TEMPORARY. Reads what escape attempts and resource abuse do under the hardened container and under
# gVisor on a hosted runner, with the options the driver uses, so that the tests are written from
# what was observed. Removed before the pull request is merged.
name: Probe escape and abuse

on:
  push:
    branches: [test/sandbox-escape-and-abuse]
    paths: [".github/workflows/probe-escape.yml"]

permissions:
  contents: read

jobs:
  probe:
    name: Probe escape and abuse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install gVisor (pinned release and checksum, as in ci.yml) and run the scenarios
        run: |
          REPO=$PWD
          cat > probe.sh <<'EOF'
          set -u
          IMG=docker.io/library/alpine@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
          docker pull -q "$IMG" >/dev/null
          gcc -static -O1 -Wall -Wextra -o /tmp/escape-probe "$REPO/engineering/sandbox-manager/test-programs/escape-probe.c" && echo "escape-probe compiled"
          cd "$(mktemp -d)"
          wget -q https://storage.googleapis.com/gvisor/releases/release/20261109.0/x86_64/gvisor.tar.zstd
          echo '0a0041fd862f4ea3042a9db8d41c742f48a01f909699adc2a0256e46d85e53f97b82b9fd154b3dce636f62b8d557677639f91c77d13f3f875ff9fa535275393c  gvisor.tar.zstd' | sha512sum -c -
          sudo tar --zstd -xf gvisor.tar.zstd -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl reload docker
          sleep 3
          echo "### host"
          uname -r; docker version --format 'docker {{.Server.Version}}'
          echo "host inotify max_user_instances=$(cat /proc/sys/fs/inotify/max_user_instances) max_user_watches=$(cat /proc/sys/fs/inotify/max_user_watches)"
          mkdir -p src && echo "hello from the source" > src/hello.txt && cp /tmp/escape-probe src/escape-probe
          base=(--network=none --ipc=private --read-only --cap-drop=ALL --security-opt=no-new-privileges --user=65534:65534 --ulimit=nofile=1024:1024 --ulimit=core=0:0 --log-driver=none)
          scratchflag=(--tmpfs=/scratch:rw,noexec,nosuid,nodev,mode=0700,uid=65534,gid=65534,size=16m)
          r() {
            local rt=$1; local rtflag=()
            [ "$rt" = runsc ] && rtflag=(--runtime=runsc)
            timeout 150 docker run --rm "${rtflag[@]}" "${base[@]}" --pids-limit="${PIDS:-64}" --memory="${MEM:-256m}" --memory-swap="${MEM:-256m}" --cpus="${CPUS:-1}" \
              --tmpfs=/scratch:rw,noexec,nosuid,nodev,mode=0700,uid=65534,gid=65534,size="${SCR:-16}"m ${XF:-} --workdir=/scratch \
              --mount type=bind,src="$PWD/src",dst=/workspace,readonly --entrypoint=sh "$IMG" -c "$2"
            echo "[exit=$?]"
          }
          S() { for rt in runc runsc; do echo "=== $1 [$rt]"; r $rt "$2" 2>&1 | head -c "${LIMIT:-4500}"; done; }
          # T <runtime> <pids> <memory> <script>: create, start, then what docker recorded
          T() {
            local rt=$1; local rtflag=(); [ "$rt" = runsc ] && rtflag=(--runtime=runsc)
            local n=probe-$RANDOM
            docker create --name "$n" "${rtflag[@]}" "${base[@]}" --pids-limit="$2" --memory="$3" --memory-swap="$3" --cpus=1 "${scratchflag[@]}" --workdir=/scratch \
              --mount type=bind,src="$PWD/src",dst=/workspace,readonly --entrypoint=sh "$IMG" -c "$4" >/dev/null || { echo "create failed"; return; }
            timeout 120 docker start -a "$n" 2>&1 | head -c 1200 | tail -c 600; echo "[start exit=${PIPESTATUS[0]}]"
            docker inspect --format '{{json .State}}' "$n"
            docker rm -f "$n" >/dev/null
          }
          TS() { for rt in runc runsc; do echo "=== $1 [$rt]"; T $rt "$2" "$3" "$4"; done; }

          LIMIT=7000 S escape-probe '/workspace/escape-probe'
          TS bomb-64 64 256m 'b() { b | b & }; b; sleep 3; echo parent-survived'
          TS bomb-128 128 256m 'b() { b | b & }; b; sleep 3; echo parent-survived'
          TS bomb-512 512 256m 'b() { b | b & }; b; sleep 3; echo parent-survived'
          TS loop-128 128 256m 'i=0; while [ $i -lt 600 ]; do i=$((i+1)); echo started=$i; sleep 20 & done'
          TS oom-main 64 64m 'x=$(head -c 200000000 /dev/zero | tr "\0" a); echo done'
          TS oom-child 64 64m 'dd if=/dev/zero of=/dev/shm/a bs=1M count=60 2>&1 | tail -1; dd if=/dev/zero of=/scratch/b bs=1M count=15 2>&1 | tail -1; echo done'
          TS oom-in-user-namespace 64 64m 'unshare -Urm sh -c "id -u; mount -t tmpfs none /mnt; dd if=/dev/zero of=/mnt/x bs=1M count=200 2>&1 | tail -1; echo after"'
          TS segv 64 256m 'sh -c "kill -SEGV \$\$"; echo status=$?'
          S tmp-default 'grep " /tmp " /proc/self/mountinfo; touch /tmp/x; echo touch=$?; cp /bin/true /tmp/t && /tmp/t; echo exec=$?'
          XF="--tmpfs=/tmp:ro,noexec,nosuid,nodev,size=1m" S tmp-readonly 'grep " /tmp " /proc/self/mountinfo; touch /tmp/x 2>&1; echo touch=$?'
          XF="--shm-size=1m" S shm-small 'df -k /dev/shm | tail -1; dd if=/dev/zero of=/dev/shm/b bs=1M count=3 2>&1 | tail -1'
          CPUS=1 S cpu-1 'read s _ < /proc/uptime; i=0; while [ $i -lt 400000 ]; do i=$((i+1)); done; read e _ < /proc/uptime; echo "$s $e" | awk "{print \"elapsed=\" \$2-\$1}"'
          CPUS=0.2 S cpu-0.2 'read s _ < /proc/uptime; i=0; while [ $i -lt 400000 ]; do i=$((i+1)); done; read e _ < /proc/uptime; echo "$s $e" | awk "{print \"elapsed=\" \$2-\$1}"'
          ipcmk -M 4096 >/dev/null; ipcmk -Q >/dev/null; echo "host ipc objects:"; ipcs -a | grep -c "^0x"
          S ipc 'ipcs -a; echo status=$?'
          echo "### inotify instances: 4 sandboxes at once, 40 each"
          for rt in runc runsc; do
            echo "--- $rt"
            for n in 1 2 3 4; do
              ( rtflag=(); [ "$rt" = runsc ] && rtflag=(--runtime=runsc)
                docker run --rm "${rtflag[@]}" "${base[@]}" --pids-limit=64 --memory=128m --memory-swap=128m --cpus=1 "${scratchflag[@]}" --workdir=/scratch --entrypoint=sh "$IMG" -c 'for i in $(seq 1 40); do inotifyd - /scratch:n >/dev/null 2>&1 & done; sleep 6; echo "running=$(pgrep -c inotifyd)"' 2>&1 | tail -2 ) &
            done
            wait
          done
          echo "### end"
          EOF
          REPO=$REPO bash probe.sh 2>&1
